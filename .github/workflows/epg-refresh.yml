# Regenerate the StarWave EPG in the repository GitHub Pages actually serves.
#
# THIS FILE BELONGS IN the public Kodi repo, NOT in the private workshop repo.
# See adr/001-epg-scheduled-regeneration.md in the workshop repo for why.
#
# CADENCE IS NOT ARBITRARY. Measured 2026-09-03 against the live upstreams:
# Samsung TV Plus publishes only ~5h of forward programme data (Roku publishes ~69h).
# 512 of the 799 playlist channels are Samsung, so anything slower than about
# four-hourly leaves two thirds of the guide dark for most of the day. Three-hourly
# leaves roughly 2x margin for GitHub's scheduled-run delays, which can be tens of
# minutes under load.
name: Refresh EPG

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The default job timeout is 360 minutes. This job downloads and parses two
    # third-party feeds, and the parser uses non-greedy regexes that degrade badly if a
    # closing tag is ever absent - so a hang is a real shape, not a hypothetical. A hung
    # run holds the epg-refresh concurrency group for six hours, which means the next
    # two scheduled refreshes never start AND the failure email that is this job's only
    # alarm arrives six hours late. A healthy run is well under a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # generate-epg.py exits non-zero when the build is unfit (2) or upstream failed
      # (3), and refuses to overwrite the existing artifact in either case. A red run
      # is the alarm: GitHub emails the repo owner when a scheduled workflow fails.
      # Without this the job would "succeed" while shipping an expired guide, which is
      # exactly how the 2026-09-03 incident stayed invisible until a television showed it.
      - name: Regenerate EPG
        env:
          # Written OUTSIDE the checkout on purpose, so it is never committed.
          # Nothing reads the uncompressed XML: the wizard configures only the
          # .gz URL (default.py:3136) and the Deck's merge log confirms it
          # fetches the .gz. Committing it cost ~1,081 KiB of PERMANENT git
          # history every run - 40% of this job's storage growth - for a file
          # no device opens. The generator still produces it; the gz is encoded
          # from it and the health check is unchanged.
          EPG_OUT_XML: /tmp/epg.xml
          EPG_OUT_GZ: iptv/epg.xml.gz
          EPG_PLAYLIST: iptv/channels.m3u8
        run: python3 .epg/generate-epg.py

      # ============================ PHASE 3 SWITCH ============================
      # ONE LINE. Change 'on' to 'off' below and the EPG stops being written into git;
      # the Release asset uploaded by the next step becomes its only publication.
      #
      # THE ONLY TWO LEGAL VALUES ARE 'on' AND 'off', lower-case, no surrounding space.
      # Anything else fails the run - see the `case` below for why that is not pedantry.
      #
      # THIS IS AN OWNER DECISION AND IT IS NOT SCHEDULED. Devices take wizard updates on
      # their own schedule, and two of them (machine, shield) are quarantined, so nobody
      # can currently observe when they have. Flipping this while any device still holds
      # the old Pages URL points that device at a file nobody updates. The evidence that
      # must exist first is written down in adr/003-epg-release-asset.md, section
      # "When phase 3 may be taken" - read it there rather than deciding from this comment.
      # ========================================================================
      - name: Commit if changed
        env:
          PUBLISH_TO_PAGES: 'on'
        run: |
          set -euo pipefail
          # ENUMERATED, NOT NEGATED. This was `[ "$PUBLISH_TO_PAGES" != "on" ]`, which
          # treats EVERY value except exactly lower-case `on` as "phase 3 is taken" and
          # exits 0. Demonstrated by running this body: 'On', 'ON', 'true', 'yes', '1',
          # 'on ' with a trailing space and '' all silently stopped the commit with a
          # GREEN run and no email, while every device was still fetching Pages - the
          # guide would freeze and nothing would say so. The comment above literally
          # invites the typo by naming the value in prose ("change 'on' to 'off'").
          # The unset case already failed loudly under `set -u`, so the loud path existed
          # for one class of mistake and not the other. Now both are loud.
          case "$PUBLISH_TO_PAGES" in
            on)
              ;;
            off)
              echo "PUBLISH_TO_PAGES=off: phase 3 is taken - the Release asset is the only publication."
              exit 0
              ;;
            *)
              echo "PUBLISH_TO_PAGES=[${PUBLISH_TO_PAGES}] is neither 'on' nor 'off'." >&2
              echo "Refusing to guess. Devices may still be fetching the Pages copy; silently" >&2
              echo "skipping the commit would freeze the guide on a green run." >&2
              exit 1
              ;;
          esac
          git config user.name  "starwave-epg-bot"
          git config user.email "starwave-epg-bot@users.noreply.github.com"
          git add iptv/epg.xml.gz
          if git diff --cached --quiet; then
            echo "EPG unchanged - nothing to publish."
            exit 0
          fi
          git commit -m "EPG refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push with an explicit refspec rather than a bare `git push`. A bare push
          # depends on actions/checkout having created a tracking branch and on
          # push.default=simple; both hold today under `schedule`, but neither is
          # promised, and a workflow_dispatch from a tag or an arbitrary ref lands on a
          # detached HEAD where a bare push fails outright.
          #
          # Retry on rejection. This job's ONLY alarm is the failure email, so a red run
          # for a reason that is not "the EPG is broken" is worse than it looks: an alarm
          # that cries wolf stops being read, and this one has to survive being the sole
          # signal for years. A manual `publish-repo.sh` landing between our fetch and our
          # push is an ordinary, expected race - roughly the frequency of a docs publish -
          # so it is retried rather than reported. Rebase, not merge: this is one bot
          # committing one pair of files, and a merge commit here is noise in a history
          # the owner reads. Genuine failures still exhaust the attempts and go red.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) - rebasing onto origin/main and retrying"
            git fetch origin main
            # Ours is the only commit on top of origin/main, and it touches only the two
            # EPG paths, so a conflict here means someone hand-edited the published EPG.
            # Fail loudly rather than resolving it silently in either direction.
            git rebase origin/main || {
              echo "rebase conflict on iptv/epg.xml* - a human edited the published EPG; not resolving automatically" >&2
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "push still rejected after 3 attempts" >&2
          exit 1

      # THE DESTINATION THAT REPLACES INSTEAD OF APPENDING.
      #
      # Committing the .gz costs ~1.5 MiB of PERMANENT git history every run, eight runs a
      # day, forever - measured at 1,556,566 packed bytes for the newest revision in the
      # workshop repo, with no delta against its predecessor because gzip streams do not
      # delta-compress. Release assets live outside the git object database and do not
      # count toward repository size, so uploading to a FIXED tag with --clobber replaces
      # one blob rather than appending a new one. The automatic GITHUB_TOKEN can already
      # write releases under the `contents: write` this job already holds, so this adds no
      # credential and no permission.
      #
      # THIS STEP IS DELIBERATELY LAST, AND THAT IS A SAFETY PROPERTY, NOT AN ACCIDENT.
      # Every device in the fleet still fetches the Pages copy today, so the commit above
      # is the device-facing publication. If this step ran first and failed, a broken
      # release upload would take the guide down with it - a new way to break televisions
      # in the name of saving storage. Running last, the new mechanism can only fail
      # forward: the run goes red, the owner is emailed, and every device still has a guide.
      #
      # --prerelease IS LOAD-BEARING, NOT COSMETIC. scripts/check-version.sh --repo in the
      # workshop repo asserts that the newest NON-prerelease release tag equals the build
      # version. A normal release here would be the newest one and would fail that check
      # from now on. Marked prerelease, it is filtered out and the check is untouched.
      #
      # There is a gap of a second or two per run where --clobber has deleted the old asset
      # and not yet finished uploading the new one, during which the URL 404s. A device that
      # lands in it keeps the guide it already merged and retries on its next interval.
      - name: Publish EPG as a Release asset
        env:
          # The one template expression in this file. It is a SECRET in `env:`, never interpolated into
          # shell text, so it is not the template-injection shape that rule exists to
          # forbid - the value cannot be influenced by anything outside GitHub. The
          # zero-expression alternative (decoding the credential actions/checkout persists
          # in .git/config) is rejected in adr/003 as more fragile and far less auditable.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=epg-current
          # Created once, never moved. The tag it creates is a single ref; it is not
          # per-run history. `gh release view` is the existence test because `gh release
          # create` on an existing tag is an error, not a no-op.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --title "EPG (rolling artifact)" \
              --notes "Rolling XMLTV guide, replaced in place by the epg-refresh workflow. Not a build release - see adr/003-epg-release-asset.md in the workshop repo."
          fi
          gh release upload "$TAG" iptv/epg.xml.gz --clobber
          # RE-ASSERT --prerelease EVERY RUN, don't just set it at creation. The flag is
          # load-bearing for check-version.sh --repo (see above), but it was set once, at
          # create time, and nothing re-established it afterwards. One click on "Set as the
          # latest release" in the GitHub releases UI - a plausible thing to do to a tag
          # called `epg-current` that keeps changing - would flip it permanently, break the
          # version check from then on, and leave no detector behind. Asserting it here
          # makes the property self-healing within three hours instead of comment-enforced
          # forever. It is a no-op when the flag is already set.
          gh release edit "$TAG" --prerelease
          echo "uploaded iptv/epg.xml.gz ($(wc -c < iptv/epg.xml.gz) bytes) to release ${TAG}, prerelease re-asserted"
